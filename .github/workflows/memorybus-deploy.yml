name: CI & Deploy to Tokyo VPS

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memorybus
          POSTGRES_PASSWORD: memorybus
          POSTGRES_DB: memorybus_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd="pg_isready -U memorybus"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 207.148.92.152
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/memorybus
            git pull origin main
            docker compose up -d --build
