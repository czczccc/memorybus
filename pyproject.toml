[project]
name = "memorybus"
version = "0.1.0"
description = "User-owned persistent memory layer shared across AI assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=3.0,<4",
    "openai>=1.50",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
memorybus = "memorybus.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memorybus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's Depends()/Query() in defaults is the framework's idiom.
ignore = ["B008"]
